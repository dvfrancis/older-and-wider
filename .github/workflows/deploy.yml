# Deploys the site to S3 on every push to main that touches something the
# live site is built from. Authenticates to AWS via OIDC (no stored keys):
# the github-actions-deploy-older-and-wider role (infra/deploy-role.yaml)
# only trusts this repo's main branch. The deploy itself is the same
# build.sh everyone runs locally, so CI and by-hand deploys cannot drift.
#
# update-episodes.yml and update-instagram.yml also call this workflow
# (workflow_call) after they commit a change, because a push made with
# GITHUB_TOKEN does not start other workflows. A called workflow runs in
# the context of the caller, so the OIDC subject is still refs/heads/main.

name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - "*.html"
      - "assets/**"
      - "build.sh"
      - "scripts/minify_css.py"
      - "sitemap.xml"
      - "robots.txt"
      - "favicon.ico"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Commit to deploy. Empty means the commit of the event.
        type: string
        required: false
        default: ""

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # inputs.ref is empty for push and workflow_dispatch, so checkout
      # takes the commit of the event as before. update-episodes.yml and
      # update-instagram.yml pass the SHA of the commit that they pushed.
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      # Keep this on v6 or later. v5 of configure-aws-credentials is still on
      # node20, so bumping to it looks like a fix but leaves the deprecation
      # warning in place. v6 is the first major to move to node24. Check the
      # action.yml of whichever major you are moving to before bumping.
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::115019371912:role/github-actions-deploy-older-and-wider
          aws-region: eu-west-2

      - name: Build and deploy
        run: ./build.sh --deploy --yes
